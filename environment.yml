  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - make
  - cxx-compiler
  - setuptools>=61
  - wheel
  - astral-tree=5.7.8
  - openjdk=17
  - tensorflow=2.15.0 #2.15.0 #2.18.0
  - matplotlib=3.8.0
  - scikit-learn=1.3.0
  - biopython=1.84
  - pybind11=2.13.1
  - ruff=0.5.2
  - ete3==3.1.3
  - seaborn==0.13.2
  - statsmodels==0.14.0
  - pandas==2.0.3
  - pip
  - pip:
    - ete4==4.3.0
    - setuptools==80.9.0
