# Development environment for PhyloAI: `bash install.sh`, or
#   conda env create -f environment.yml && conda activate phyloAI && pip install -e . --no-deps
# Users can instead install the released package: conda install -c conda-forge -c bioconda phyloai
name: phyloAI
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python >=3.10
  - pip
  - setuptools >=61
  # PhyloAI
  - numpy
  - tensorflow >=2.15
  - tf-keras  # Keras 2 for `phyloai train` with TensorFlow >=2.16
  - scikit-learn
  - biopython
  # Tools from bioconda
  - quartet-pattern-counter >=1.8,<2
  - astraq >=0.5.8
  - astral-tree >=5.7.8
  - qfm-fi >=2.1.4
  - polymosim >=1.2.0
  - openjdk >=17
  # Helper commands vis-tree and pca-variance-plot
  - matplotlib
  - ete3
  # Development
  - pytest
  - ruff
