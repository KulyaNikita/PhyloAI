# Install the published phyloai package from bioconda (not this checkout) on all four platforms
# and run it. Started by hand from the Actions tab or with `gh workflow run bioconda-package.yml`.
name: bioconda package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "phyloai version to install (empty: the latest)"
        required: false
        default: ""
  push:
    paths:
      - .github/workflows/bioconda-package.yml

jobs:
  test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-64, os: ubuntu-latest}
          - {platform: linux-aarch64, os: ubuntu-24.04-arm}
          - {platform: osx-64, os: macos-15-intel}
          - {platform: osx-arm64, os: macos-latest}
    defaults:
      run:
        shell: bash -el {0}  # Login shell, so the conda environment is active.
    env:
      # Inside the checkout: actions/cache does not save paths that contain '..'.
      PHYLOAI_DATA: ${{ github.workspace }}/.phyloai-data
      VERSION: ${{ inputs.version }}

    steps:
      # Only for the example alignments; PhyloAI itself comes from bioconda.
      - uses: actions/checkout@v5

      - name: Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: phyloai
          channels: conda-forge,bioconda
          channel-priority: strict

      - name: Install phyloai from bioconda
        run: |
          conda install -y "phyloai${VERSION:+=$VERSION}"
          conda list | grep -E '^(phyloai|python|tensorflow|tf-keras|quartet-pattern-counter|astraq|astral-tree|qfm-fi|polymosim|openjdk) '
          test "$(conda list --json phyloai | python -c 'import json,sys; print(json.load(sys.stdin)[0]["channel"])')" = bioconda
          phyloai --version
          phyloai check --no-models

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: ${{ env.PHYLOAI_DATA }}
          key: phyloai-models-${{ matrix.platform }}-${{ hashFiles('src/phyloai/data/*.SHA256SUMS') }}

      - name: Download the models
        run: |
          phyloai download-models
          phyloai check

      - name: Run with ModelDetector
        run: |
          phyloai run --alignment proteins.fasta --output "$RUNNER_TEMP/results"
          cat "$RUNNER_TEMP/results/astraq.tre"

      - name: Run per gene with all methods
        run: |
          phyloai run --alignment genes/ --method all --output "$RUNNER_TEMP/results_per_gene"
          cat "$RUNNER_TEMP/results_per_gene"/*.tre

      - name: Simulate, train and run a small network
        run: |
          cd "$RUNNER_TEMP"
          phyloai simulate -substitution_model LG --alignment-length 200 --replicates 30 -processes 4 -output_dir sim
          phyloai train --training-data sim/site_pattern_frequencies_LG_L200_R30.npy \
            --topology-data sim/trainTopoClass_LG_L200_R30.npy --length-data sim/trainLength_LG_L200_R30.npy \
            --substitution-model LG --method fisher --selected-patterns 100 --epochs 2 --batch-size 32 \
            --output-dir trained --threads 4
          phyloai run --alignment "$GITHUB_WORKSPACE/proteins.fasta" --models trained --substitution-model LG \
            --method astraq --output results_trained
